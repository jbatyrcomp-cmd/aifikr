<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-FIKR — Admin dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="login-card" id="login-view">
      <p class="eyebrow">AI-FIKR boshqaruv paneli</p>
      <h1>Admin dashboard</h1>
      <p class="muted">Javoblar va arizalarni ko‘rish uchun login qiling.</p>
      <form id="login-form">
        <label>Login<input name="username" required autocomplete="username"></label>
        <label>Parol<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="button button-primary" type="submit">Kirish</button>
        <p class="form-message" id="login-status" role="alert"></p>
      </form>
    </section>

    <section class="dashboard" id="dashboard-view" hidden>
      <header class="dashboard-header">
        <div><p class="eyebrow">AI-FIKR</p><h1>Admin dashboard</h1></div>
        <div class="header-actions"><span id="admin-name"></span><button class="button button-light" id="logout-button" type="button">Chiqish</button></div>
      </header>
      <section class="stats-grid" aria-label="Umumiy statistika">
        <article class="stat-card"><span>Jami javoblar</span><strong id="total-count">0</strong></article>
        <article class="stat-card"><span>So‘rovnomalar</span><strong id="survey-count">0</strong></article>
        <article class="stat-card"><span>İştirökçi arizalari</span><strong id="participant-count">0</strong></article>
        <article class="stat-card"><span>Tashkilotchi arizalari</span><strong id="organizer-count">0</strong></article>
      </section>
      <section class="toolbar">
        <label>Turini tanlang<select id="type-filter"><option value="">Barchasi</option><option value="survey">So‘rovnoma</option><option value="participant">İştirökçi volontyor</option><option value="organizer">Loyiha tashkilotchisi</option></select></label>
        <label>Qidirish<input id="search-input" type="search" placeholder="Ism, fakultet yoki javob..."></label>
        <button class="button button-primary" id="refresh-button" type="button">Yangilash</button>
        <button class="button button-light" id="export-button" type="button">CSV eksport</button>
      </section>
      <p class="form-message" id="dashboard-status" role="status"></p>
      <div class="table-wrap"><table><thead id="responses-head"></thead><tbody id="responses-body"></tbody></table></div>
    </section>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
